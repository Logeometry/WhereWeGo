<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗺️ 카카오맵 코스 테스트 - 부산 여행</title>
    <!-- 카카오맵 API 키는 JavaScript에서 동적으로 로드됩니다 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 0;
            min-height: 700px;
        }

        .sidebar {
            background: #f8f9fa;
            padding: 30px;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            max-height: 700px;
        }

        .map-container {
            position: relative;
            background: #e9ecef;
        }

        #map {
            width: 100%;
            height: 700px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h3 {
            color: #495057;
            margin-bottom: 15px;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .place-item {
            background: white;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .place-item:hover {
            transform: translateX(5px);
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .place-item.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .place-item .icon {
            font-size: 1.5em;
        }

        .place-item .info {
            flex: 1;
        }

        .place-item .name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .place-item .category {
            font-size: 0.85em;
            opacity: 0.7;
        }

        .selected-places {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            min-height: 100px;
        }

        .selected-place-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #667eea;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            margin: 5px;
            font-size: 0.9em;
        }

        .selected-place-tag .remove {
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .route-info {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .route-segment {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 5px solid;
        }

        .route-segment .route-header {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .route-segment .route-details {
            font-size: 0.9em;
            color: #666;
        }

        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            text-align: center;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .preset-course {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #dee2e6;
            transition: all 0.2s;
        }

        .preset-course:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .preset-course .title {
            font-weight: bold;
            color: #495057;
            margin-bottom: 5px;
        }

        .preset-course .places {
            font-size: 0.85em;
            color: #6c757d;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }

            .sidebar {
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ 부산 여행 코스 경로 테스트</h1>
            <p>관광지를 선택하고 카카오맵에서 실제 경로를 확인해보세요!</p>
        </div>

        <div class="content">
            <!-- 사이드바 -->
            <div class="sidebar">
                <!-- 이동 수단 선택 -->
                <div class="travel-mode-selector" style="background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                    <label for="travel-mode" style="display: block; margin-bottom: 8px; font-weight: bold; color: #495057;">🚗 이동 수단 선택</label>
                    <select id="travel-mode" style="width: 100%; padding: 10px; border: 2px solid #dee2e6; border-radius: 6px; font-size: 1em; background: white;">
                        <option value="transit">🚇 대중교통 (추천)</option>
                        <option value="driving">🚗 자동차</option>
                        <option value="walking">🚶 도보</option>
                    </select>
                </div>

                <!-- 추천 코스 -->
                <div class="section">
                    <h3>⭐ 추천 코스 (클릭하면 자동 선택)</h3>
                    <div class="preset-course" onclick="loadPresetCourse('classic')">
                        <div class="title">🏖️ 클래식 부산 1일 코스</div>
                        <div class="places">해운대 → 광안리 → 감천문화마을</div>
                    </div>
                    <div class="preset-course" onclick="loadPresetCourse('history')">
                        <div class="title">🏛️ 역사 문화 코스</div>
                        <div class="places">용두산공원 → 자갈치시장 → 태종대</div>
                    </div>
                    <div class="preset-course" onclick="loadPresetCourse('nature')">
                        <div class="title">🌊 자연 힐링 코스</div>
                        <div class="places">태종대 → 이기대 → 송도해수욕장</div>
                    </div>
                    <div class="preset-course" onclick="loadPresetCourse('family')">
                        <div class="title">👨‍👩‍👧 가족 여행 코스</div>
                        <div class="places">아쿠아리움 → 해운대 → 오륙도</div>
                    </div>
                </div>

                <!-- 선택된 장소 -->
                <div class="section">
                    <h3>📍 선택된 장소 (<span id="selected-count">0</span>개)</h3>
                    <div class="alert alert-info">
                        💡 최소 2개 이상의 장소를 선택해주세요
                    </div>
                    <div id="selected-places" class="selected-places">
                        <p style="color: #999; text-align: center;">장소를 선택해주세요</p>
                    </div>
                </div>

                <!-- 장소 목록 -->
                <div class="section">
                    <h3>🏛️ 부산 주요 관광지</h3>
                    <div id="place-list">
                        <!-- JavaScript로 동적 생성 -->
                    </div>
                </div>

                <!-- 버튼 -->
                <button class="btn btn-primary" onclick="generateRoute()" id="generate-btn" disabled>
                    🗺️ 경로 생성하기
                </button>
                <button class="btn btn-secondary" onclick="clearSelection()">
                    🔄 선택 초기화
                </button>

                <!-- 경로 정보 -->
                <div id="route-info" style="display: none;">
                    <div class="section">
                        <h3>📊 경로 정보</h3>
                        <div id="route-segments"></div>
                    </div>
                </div>
            </div>

            <!-- 지도 -->
            <div class="map-container">
                <div id="map"></div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <div>경로를 계산하고 있습니다...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        
        // 부산 주요 관광지 목록 (DB에서 동적으로 로드됨)
        let BUSAN_ATTRACTIONS = [];
        
        // 실제 DB에서 가져온 장소 ID 목록 (하드코딩된 샘플)
        const SAMPLE_PLACE_IDS = [
            '681891fa77e67d6ebadae358',
            '681891fa77e67d6ebadae359',
            '681891fa77e67d6ebadae35a',
            '681891fa77e67d6ebadae35b',
            '681891fa77e67d6ebadae35c'
        ];

        // 추천 코스 데이터 (장소 ID로 저장됨)
        let PRESET_COURSES = {
            classic: [],
            history: [],
            nature: [],
            family: []
        };

        let selectedPlaces = [];
        let placeIdMap = {}; // 장소명 -> ObjectId 매핑
        let kakaoMap = null;
        let markers = [];
        let polylines = [];
        let customOverlays = []; // 대중교통 정보 오버레이

        // 페이지 로드 시 초기화
        window.onload = async function() {
            try {
                // 1. 먼저 API 키 로드
                await loadKakaoAPIKey();
                
                // 2. DB에서 장소 로드
                await loadPlacesFromDB();
                
                // 3. 장소 목록 UI 초기화
                initPlaceList();
                
                // 4. 카카오맵 초기화 (SDK 로드 대기)
                let retryCount = 0;
                const maxRetries = 10;
                
                const initMap = () => {
                    if (typeof kakao !== 'undefined' && kakao.maps) {
                        initKakaoMap();
                        console.log('✅ 카카오맵 초기화 완료');
                    } else if (retryCount < maxRetries) {
                        retryCount++;
                        console.log(`⏳ 카카오맵 SDK 로드 대기 중... (${retryCount}/${maxRetries})`);
                        setTimeout(initMap, 500);
                    } else {
                        console.warn('⚠️ 카카오맵 SDK를 찾을 수 없습니다. 지도 기능이 비활성화됩니다.');
                    }
                };
                
                initMap();
                
                console.log('✅ 카카오맵 코스 테스트 페이지 로드 완료');
            } catch (error) {
                console.error('❌ 페이지 초기화 실패:', error);
                console.warn('⚠️ Fallback 모드로 전환합니다');
            }
        };

        // 카카오맵 API 키 동적 로드
        async function loadKakaoAPIKey() {
            try {
                console.log('🔑 카카오맵 API 키 로드 중...');
                const response = await fetch(`${API_BASE_URL}/api/v1/config/kakao-javascript-key`);
                
                if (!response.ok) {
                    throw new Error(`API 키 로드 실패: ${response.status}`);
                }
                
                const data = await response.json();
                const apiKey = data.api_key;
                
                if (!apiKey) {
                    throw new Error('API 키가 비어있습니다');
                }
                
                console.log('✅ 카카오맵 API 키 로드 완료');
                
                // 동적으로 스크립트 태그 생성하여 카카오맵 SDK 로드
                const script = document.createElement('script');
                script.type = 'text/javascript';
                script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${apiKey}`;
                script.async = true;
                
                script.onload = function() {
                    console.log('✅ 카카오맵 SDK 로드 완료');
                };
                
                script.onerror = function() {
                    console.error('❌ 카카오맵 SDK 로드 실패');
                };
                
                document.head.appendChild(script);
                
            } catch (error) {
                console.error('❌ 카카오맵 API 키 로드 실패:', error);
                throw error;
            }
        }

        // DB에서 실제 장소 데이터 로드
        async function loadPlacesFromDB() {
            try {
                console.log('🔍 DB에서 장소 데이터 로드 중...');
                
                // 방법 1: /api/v1/simple_detail로 전체 장소 조회
                const response = await fetch(`${API_BASE_URL}/api/v1/simple_detail`);
                
                if (!response.ok) {
                    throw new Error(`API 오류: ${response.status}`);
                }
                
                const allPlaces = await response.json();
                console.log(`✅ DB에서 ${allPlaces.length}개 장소 로드 완료`);
                console.log('📋 첫 번째 장소 샘플:', allPlaces[0]);
                
                // 데이터가 비어있으면 에러
                if (!allPlaces || allPlaces.length === 0) {
                    throw new Error('DB에 장소 데이터가 없습니다');
                }
                
                // 인기 장소 30개만 선택
                const popularPlaces = allPlaces.slice(0, 30);
                
                BUSAN_ATTRACTIONS = popularPlaces.map(place => ({
                    id: place.id || place._id,  // id 또는 _id 필드 확인
                    name: place.name || '이름 없음',
                    category: place.category_group || place.category || '기타',
                    icon: getIconForPlace(place),
                    rating: place.rating || 0
                }));
                
                // ID 매핑도 미리 저장
                BUSAN_ATTRACTIONS.forEach(place => {
                    placeIdMap[place.name] = place.id;
                });
                
                // 추천 코스 설정 (DB에서 로드된 장소 기준)
                setupPresetCourses(BUSAN_ATTRACTIONS);
                
                console.log('✅ 장소 데이터 준비 완료:', BUSAN_ATTRACTIONS.length);
                console.log('📋 준비된 장소들:', BUSAN_ATTRACTIONS.slice(0, 5).map(p => p.name).join(', ') + '...');
                
            } catch (error) {
                console.error('❌ DB 장소 로드 실패:', error);
                console.error('상세 오류:', error.message);
                
                // Fallback: 샘플 ID로 직접 장소 정보 조회
                await loadPlacesBySampleIds();
            }
        }

        // Fallback: 샘플 ID로 장소 로드
        async function loadPlacesBySampleIds() {
            try {
                console.log('🔄 Fallback: 샘플 ID로 장소 로드 중...');
                BUSAN_ATTRACTIONS = [];
                
                for (const placeId of SAMPLE_PLACE_IDS) {
                    try {
                        const response = await fetch(`${API_BASE_URL}/api/v1/simple_detail?query=${placeId}`);
                        const data = await response.json();
                        
                        if (data && data.length > 0) {
                            const place = data[0];
                            const placeId = place.id || place._id;
                            BUSAN_ATTRACTIONS.push({
                                id: placeId,
                                name: place.name || '장소',
                                category: place.category_group || '관광지',
                                icon: getIconForPlace(place)
                            });
                            placeIdMap[place.name] = placeId;
                        }
                    } catch (err) {
                        console.error(`장소 ${placeId} 로드 실패:`, err);
                    }
                }
                
                console.log(`✅ Fallback으로 ${BUSAN_ATTRACTIONS.length}개 장소 로드 완료`);
                setupPresetCourses(BUSAN_ATTRACTIONS);
                
            } catch (error) {
                console.error('❌ Fallback도 실패:', error);
                
                // 최종 Fallback: 검색 기능
                const container = document.getElementById('place-list');
                if (container) {
                    container.innerHTML = `
                        <div style="padding: 20px; text-align: center;">
                            <p style="color: #e74c3c; font-weight: bold;">⚠️ 장소 목록을 불러올 수 없습니다</p>
                            <p style="color: #666; font-size: 0.9em; margin-top: 10px;">
                                아래 검색 기능을 사용해주세요
                            </p>
                        </div>
                    `;
                }
                addSearchFunctionality();
            }
        }

        // 장소 타입에 따른 아이콘 선택
        function getIconForPlace(place) {
            const name = place.name.toLowerCase();
            const category = (place.category_type || place.category_group || '').toLowerCase();
            
            // 이름 기반 아이콘
            if (name.includes('해수욕장') || name.includes('비치')) return '🏖️';
            if (name.includes('공원')) return '🌳';
            if (name.includes('시장')) return '🐟';
            if (name.includes('사찰') || name.includes('절')) return '⛩️';
            if (name.includes('타워')) return '🗼';
            if (name.includes('대교')) return '🌉';
            if (name.includes('아쿠아리움')) return '🐠';
            if (name.includes('마을')) return '🎨';
            
            // 카테고리 기반 아이콘
            if (category.includes('문화')) return '🎨';
            if (category.includes('자연')) return '🌲';
            if (category.includes('레포츠')) return '⚽';
            if (category.includes('쇼핑')) return '🛍️';
            if (category.includes('음식')) return '🍽️';
            if (category.includes('숙박')) return '🏨';
            
            return '📍'; // 기본 아이콘
        }

        // 추천 코스 설정
        function setupPresetCourses(places) {
            if (!places || places.length === 0) {
                console.warn('⚠️ 장소 데이터가 없어 추천 코스를 설정할 수 없습니다');
                return;
            }
            
            console.log(`📋 추천 코스 설정 시작: ${places.length}개 장소`);
            
            // 장소명으로 찾기 (유연한 매칭)
            function findPlaceByName(searchNames) {
                for (const searchName of searchNames) {
                    const place = places.find(p => 
                        p.name.includes(searchName) || searchName.includes(p.name)
                    );
                    if (place) return place.name;
                }
                return null;
            }
            
            // 클래식 코스
            const beach1 = findPlaceByName(['해운대', 'Haeundae']);
            const beach2 = findPlaceByName(['광안리', 'Gwangalli']);
            const village = findPlaceByName(['감천', 'Gamcheon']);
            
            if (beach1 && beach2 && village) {
                PRESET_COURSES.classic = [beach1, beach2, village];
                console.log('✅ 클래식 코스 설정:', PRESET_COURSES.classic);
            } else if (places.length >= 3) {
                // Fallback: 처음 3개 장소
                PRESET_COURSES.classic = places.slice(0, 3).map(p => p.name);
                console.log('✅ 클래식 코스 설정 (Fallback):', PRESET_COURSES.classic);
            }
            
            // 나머지 코스도 설정
            if (places.length >= 6) {
                PRESET_COURSES.history = places.slice(3, 6).map(p => p.name);
                console.log('✅ 역사 문화 코스 설정:', PRESET_COURSES.history);
            } else if (places.length >= 3) {

        // 장소 검색 및 추가
        async function searchAndAddPlace() {
            const input = document.getElementById('place-search');
            const query = input.value.trim();
            
            if (!query) {
                alert('장소명을 입력해주세요');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/v1/simple_detail?query=${encodeURIComponent(query)}`);

                if (data && data.length > 0) {
                    const place = data[0];
                    const placeId = place.id || place._id;
                    
                    if (!placeId) {

                    }
                    
                    togglePlace(place.name);
                    
                    // placeIdMap에 추가
                    placeIdMap[place.name] = placeId;
                    
                    alert(`"${place.name}" 장소가 추가되었습니다!`);
                    input.value = '';
                } else {
                    alert('검색 결과가 없습니다. 다른 키워드로 시도해보세요.');

            }
        }

        // 장소 선택/해제
        function togglePlace(placeName) {
            const index = selectedPlaces.indexOf(placeName);
            if (index === -1) {
                selectedPlaces.push(placeName);
            } else {
                selectedPlaces.splice(index, 1);
            }
            updateSelectedPlaces();
            updatePlaceListUI();
        }

        // 선택된 장소 UI 업데이트
        function updateSelectedPlaces() {
            const container = document.getElementById('selected-places');
            const count = document.getElementById('selected-count');
            count.textContent = selectedPlaces.length;

            if (selectedPlaces.length === 0) {
                container.innerHTML = '<p style="color: #999; text-align: center;">장소를 선택해주세요</p>';
                document.getElementById('generate-btn').disabled = true;
            } else {
                container.innerHTML = '';
                selectedPlaces.forEach((name, idx) => {
                    const tag = document.createElement('div');
                    tag.className = 'selected-place-tag';
                    tag.innerHTML = `
                        <span>${idx + 1}. ${name}</span>
                        <span class="remove" onclick="removePlace('${name}')">✕</span>
                    `;
                    container.appendChild(tag);
                });
                document.getElementById('generate-btn').disabled = selectedPlaces.length < 2;
            }
        }

        // 장소 목록 UI 업데이트
        function updatePlaceListUI() {
            const items = document.querySelectorAll('.place-item');
            items.forEach(item => {
                const name = item.querySelector('.name').textContent;
                if (selectedPlaces.includes(name)) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });

        // 장소 제거
        function removePlace(placeName) {
            const index = selectedPlaces.indexOf(placeName);
            if (index !== -1) {
                selectedPlaces.splice(index, 1);
                updateSelectedPlaces();
                updatePlaceListUI();
            }

        function clearSelection() {

        // 추천 코스 로드
        function loadPresetCourse(courseType) {
            console.log('📋 추천 코스 로드:', courseType);
            console.log('📋 PRESET_COURSES:', PRESET_COURSES);
            
            const course = PRESET_COURSES[courseType];
            
            // 코스가 비어있거나 없으면
            if (!course || course.length === 0) {
                console.error('❌ 추천 코스가 비어있습니다');
                
                // BUSAN_ATTRACTIONS에서 랜덤으로 선택
                if (BUSAN_ATTRACTIONS.length >= 3) {
                    const randomPlaces = BUSAN_ATTRACTIONS
                        .slice(0, Math.min(10, BUSAN_ATTRACTIONS.length))
                        .sort(() => Math.random() - 0.5)
                        .slice(0, 3)
                        .map(p => p.name);
                    
                    selectedPlaces = randomPlaces;
                    console.log('✅ 랜덤 코스 생성:', selectedPlaces);
                } else {
                    alert('아직 장소 데이터가 로드되지 않았습니다. 잠시 후 다시 시도해주세요.');
                    return;
                }
            } else {
                selectedPlaces = [...course];
                console.log('✅ 추천 코스 선택:', selectedPlaces);
            }
            
            updateSelectedPlaces();
            updatePlaceListUI();
            
            // 대중교통 모드로 자동 설정
            document.getElementById('travel-mode').value = 'transit';
            
            // 자동으로 경로 생성
            setTimeout(() => generateRoute(), 500);

        // 경로 생성
        async function generateRoute() {
            if (selectedPlaces.length < 2) {
                alert('최소 2개 이상의 장소를 선택해주세요.');
                return;
            }

            showLoading();

            try {
                // 1단계: 장소 이름으로 ObjectId 조회
                console.log('🔍 1단계: 장소 ID 조회 중...');
                const placeIds = await getPlaceIds(selectedPlaces);

                if (placeIds.length !== selectedPlaces.length) {
                    throw new Error('일부 장소를 찾을 수 없습니다.');
                }

                // 2단계: 경로 데이터 요청
                const travelMode = document.getElementById('travel-mode').value;
                console.log(`🛣️ 2단계: 경로 계산 중... (이동수단: ${travelMode})`);
                
                const response = await fetch(`${API_BASE_URL}/api/v1/map/course-route`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        places: placeIds,
                        mode: travelMode
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 오류: ${response.status}`);
                }

                const data = await response.json();
                console.log('✅ 경로 데이터 수신:', data);

                // 3단계: 지도에 표시
                displayRouteOnMap(data);
                displayRouteInfo(data);

            } catch (error) {
                console.error('❌ 경로 생성 실패:', error);
                alert(`경로 생성 중 오류가 발생했습니다: ${error.message}`);
            } finally {
                hideLoading();
            }
        }

        // 장소 이름으로 ObjectId 조회
        async function getPlaceIds(placeNames) {
            const ids = [];
            const notFoundPlaces = [];
            
            for (const name of placeNames) {
                // 1. 캐시 확인
                if (placeIdMap[name]) {
                    ids.push(placeIdMap[name]);
                    console.log(`✅ (캐시) ${name} ID: ${placeIdMap[name]}`);
                    continue;
                }

                // 2. BUSAN_ATTRACTIONS에서 찾기 (이미 DB에서 로드한 데이터)
                const attraction = BUSAN_ATTRACTIONS.find(a => a.name === name);
                if (attraction && attraction.id) {
                    placeIdMap[name] = attraction.id;
                    ids.push(attraction.id);
                    console.log(`✅ (로컬) ${name} ID: ${attraction.id}`);
                    continue;
                }

                // 3. API로 검색 (로컬에서 못 찾은 경우)
                try {
                    console.log(`🔍 API 검색: ${name}`);
                    const response = await fetch(`${API_BASE_URL}/api/v1/simple_detail?query=${encodeURIComponent(name)}`);
                    
                    if (!response.ok) {
                        console.error(`❌ ${name} 검색 API 오류: ${response.status}`);
                        notFoundPlaces.push(name);
                        continue;
                    }
                    
                    const data = await response.json();
                    console.log(`🔍 ${name} 검색 결과:`, data);
                    
                    // location_detail API는 Tourism 객체 배열을 반환
                    if (Array.isArray(data) && data.length > 0) {
                        // id 또는 _id 필드 확인
                        const placeId = data[0].id || data[0]._id;
                        
                        if (!placeId) {
                            console.error(`❌ ${name} ID 필드를 찾을 수 없음. 응답:`, data[0]);
                            notFoundPlaces.push(name);
                        } else {
                        placeIdMap[name] = placeId;
                        ids.push(placeId);
                            console.log(`✅ (API) ${name} ID: ${placeId}`);
                        }
                    } else {
                        console.error(`❌ ${name} 검색 결과 없음`);
                        notFoundPlaces.push(name);
                    }
                } catch (error) {
                    console.error(`❌ ${name} 검색 실패:`, error);
                    notFoundPlaces.push(name);
                }
            }

            // 찾지 못한 장소가 있으면 상세 에러 표시
            if (notFoundPlaces.length > 0) {
                throw new Error(`다음 장소를 찾을 수 없습니다:\n${notFoundPlaces.join('\n')}\n\n실제 DB에 저장된 정확한 장소명을 사용해주세요.`);
            }

            return ids;
        }

        // 지도에 경로 표시
        function displayRouteOnMap(data) {
            if (!kakaoMap || typeof kakao === 'undefined') {
                console.warn('⚠️ 카카오맵이 초기화되지 않았습니다');
                alert('지도를 표시할 수 없지만, 경로 정보는 아래에서 확인할 수 있습니다.');
                return;
            }
            
            // 기존 마커/경로 제거
            clearMap();

            // 지도 중심 이동
            const center = new kakao.maps.LatLng(data.center.lat, data.center.lng);
            kakaoMap.setCenter(center);
            kakaoMap.setLevel(data.zoom);

            // 마커 표시
            data.markers.forEach(marker => {
                const position = new kakao.maps.LatLng(marker.lat, marker.lng);
                
                const kakaoMarker = new kakao.maps.Marker({
                    position: position,
                    map: kakaoMap
                });

                // 마커 클릭 시 정보창
                const infowindow = new kakao.maps.InfoWindow({
                    content: `
                        <div style="padding:10px; min-width:150px;">
                            <strong>${marker.order}. ${marker.name}</strong><br>
                            <small style="color:#666;">${marker.address}</small>
                        </div>
                    `
                });

                kakao.maps.event.addListener(kakaoMarker, 'click', function() {
                    infowindow.open(kakaoMap, kakaoMarker);
                });

                markers.push({ marker: kakaoMarker, infowindow });
            });

            // 경로 표시 (각 구간별로 다른 색상!)
            data.segments.forEach((segment, segIdx) => {
                // 기본 경로선 표시
                const path = segment.polyline.map(coord => 
                    new kakao.maps.LatLng(coord.lat, coord.lng)
                );

                const polyline = new kakao.maps.Polyline({
                    path: path,
                    strokeWeight: 5,
                    strokeColor: segment.color,
                    strokeOpacity: 0.7,
                    strokeStyle: 'solid'
                });

                polyline.setMap(kakaoMap);
                polylines.push(polyline);
                
                // 상세 경로 단계 표시 (버스, 도보 등)
                if (segment.steps && segment.steps.length > 0) {
                    displayTransitStepsOnMap(segment, segIdx);
                }
            });

            console.log(`🗺️ 지도 표시 완료: ${markers.length}개 마커, ${polylines.length}개 경로, ${customOverlays.length}개 오버레이`);
        }

        // 경로 정보 표시
        function displayRouteInfo(data) {
            const container = document.getElementById('route-segments');
            container.innerHTML = '';

            let totalDistance = 0;
            let totalDuration = 0;

            data.segments.forEach((segment, idx) => {
                totalDistance += segment.distance_km;
                totalDuration += segment.duration_minutes;

                const div = document.createElement('div');
                div.className = 'route-segment';
                div.style.borderLeftColor = segment.color;
                
                let segmentHTML = `
                    <div class="route-header" style="font-weight: bold; margin-bottom: 10px; font-size: 1.1em;">
                        ${idx + 1}. ${segment.from_place} → ${segment.to_place}
                    </div>
                    <div class="route-details" style="font-size: 0.9em; color: #666; margin-bottom: 10px;">
                        📏 거리: ${segment.distance_km}km | ⏱️ 시간: ${Math.round(segment.duration_minutes)}분
                    </div>
                `;
                
                // 상세 경로 단계 표시 (버스, 도보 등)
                if (segment.steps && segment.steps.length > 0) {
                    segmentHTML += `<div style="margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 5px;">`;
                    segmentHTML += `<div style="font-weight: bold; margin-bottom: 8px; color: #495057;">📋 상세 경로:</div>`;
                    
                    segment.steps.forEach((step, stepIdx) => {
                        if (step.travel_mode === 'TRANSIT' && step.transit_details) {
                            const transit = step.transit_details;
                            const vehicleIcon = getVehicleIcon(transit.vehicle_type);
                            
                            segmentHTML += `
                                <div style="margin-bottom: 8px; padding: 8px; background: white; border-radius: 4px;">
                                    <div style="font-weight: bold; color: #667eea;">
                                        ${vehicleIcon} ${transit.line_short_name || transit.line_name}
                                        ${transit.headsign ? `(${transit.headsign} 방면)` : ''}
                                    </div>
                                    <div style="font-size: 0.85em; color: #666; margin-top: 3px;">
                                        ${transit.departure_stop} → ${transit.arrival_stop}
                                        ${transit.num_stops > 0 ? `(${transit.num_stops}개 정류장)` : ''}
                                    </div>
                                    <div style="font-size: 0.85em; color: #888;">
                                        ⏱️ ${step.duration} | 📏 ${step.distance}
                                    </div>
                                </div>
                            `;
                        } else if (step.travel_mode === 'WALKING') {
                            segmentHTML += `
                                <div style="margin-bottom: 8px; padding: 8px; background: white; border-radius: 4px;">
                                    <div style="font-weight: bold; color: #52b788;">
                                        🚶 도보
                                    </div>
                                    <div style="font-size: 0.85em; color: #666; margin-top: 3px;">
                                        ${stripHTML(step.instruction)}
                                    </div>
                                    <div style="font-size: 0.85em; color: #888;">
                                        ⏱️ ${step.duration} | 📏 ${step.distance}
                                    </div>
                                </div>
                            `;
                        }
                    });
                    
                    segmentHTML += `</div>`;
                }
                
                div.innerHTML = segmentHTML;
                container.appendChild(div);
            });

            // 총합 표시
            const summary = document.createElement('div');
            summary.className = 'alert alert-success';
            summary.style.marginTop = '10px';
            summary.innerHTML = `
                <strong>📊 총 거리:</strong> ${totalDistance.toFixed(1)}km<br>
                <strong>⏱️ 총 소요시간:</strong> ${Math.round(totalDuration)}분 (약 ${Math.round(totalDuration/60)}시간)
            `;
            container.appendChild(summary);

            document.getElementById('route-info').style.display = 'block';
        }

        // 교통수단 아이콘 반환
        function getVehicleIcon(vehicleType) {
            const icons = {
                'BUS': '🚌',
                'SUBWAY': '🚇',
                'TRAIN': '🚆',
                'TRAM': '🚊',
                'RAIL': '🚄',
                'FERRY': '⛴️'
            };
            return icons[vehicleType] || '🚍';
        }

        // HTML 태그 제거
        function stripHTML(html) {
            const temp = document.createElement('div');
            temp.innerHTML = html;
            return temp.textContent || temp.innerText || '';
        }

        // 대중교통 경로 단계를 지도에 표시
        function displayTransitStepsOnMap(segment, segmentIndex) {
            if (!segment.steps) return;
            
            let currentPolylineIndex = 0;
            
            segment.steps.forEach((step, stepIdx) => {
                if (step.travel_mode === 'TRANSIT' && step.transit_details) {
                    const transit = step.transit_details;
                    
                    // 경로선의 중간 지점 찾기
                    const midIndex = Math.floor(segment.polyline.length / (segment.steps.length + 1) * (stepIdx + 1));
                    const midPoint = segment.polyline[midIndex] || segment.polyline[Math.floor(segment.polyline.length / 2)];
                    
                    if (midPoint) {
                        const position = new kakao.maps.LatLng(midPoint.lat, midPoint.lng);
                        
                        // 대중교통 정보 오버레이 생성
                        const vehicleIcon = getVehicleIconForMap(transit.vehicle_type);
                        const content = `
                            <div style="
                                padding: 8px 12px;
                                background: white;
                                border: 2px solid ${segment.color};
                                border-radius: 20px;
                                box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                                font-weight: bold;
                                font-size: 13px;
                                white-space: nowrap;
                                cursor: pointer;
                            ">
                                ${vehicleIcon} ${transit.line_short_name || transit.line_name}
                            </div>
                        `;
                        
                        const overlay = new kakao.maps.CustomOverlay({
                            position: position,
                            content: content,
                            yAnchor: 0.5,
                            zIndex: 100
                        });
                        
                        overlay.setMap(kakaoMap);
                        customOverlays.push(overlay);
                    }
                } else if (step.travel_mode === 'WALKING') {
                    // 도보 구간 표시
                    const walkIndex = Math.floor(segment.polyline.length / (segment.steps.length + 1) * (stepIdx + 1));
                    const walkPoint = segment.polyline[walkIndex] || segment.polyline[0];
                    
                    if (walkPoint) {
                        const position = new kakao.maps.LatLng(walkPoint.lat, walkPoint.lng);
                        
                        const content = `
                            <div style="
                                padding: 6px 10px;
                                background: #52b788;
                                color: white;
                                border-radius: 15px;
                                box-shadow: 0 2px 6px rgba(0,0,0,0.15);
                                font-weight: bold;
                                font-size: 12px;
                                white-space: nowrap;
                            ">
                                🚶 도보 ${step.duration}
                            </div>
                        `;
                        
                        const overlay = new kakao.maps.CustomOverlay({
                            position: position,
                            content: content,
                            yAnchor: 0.5,
                            zIndex: 99
                        });
                        
                        overlay.setMap(kakaoMap);
                        customOverlays.push(overlay);
                    }
                }
            });
        }

        // 지도용 교통수단 아이콘
        function getVehicleIconForMap(vehicleType) {
            const icons = {
                'BUS': '🚌',
                'SUBWAY': '🚇',
                'TRAIN': '🚆',
                'TRAM': '🚊',
                'RAIL': '🚄',
                'FERRY': '⛴️'
            };
            return icons[vehicleType] || '🚍';
        }

        // 지도 초기화
        function clearMap() {
            markers.forEach(m => m.marker.setMap(null));
            polylines.forEach(p => p.setMap(null));
            customOverlays.forEach(o => o.setMap(null));
            markers = [];
            polylines = [];
            customOverlays = [];
        }

        // 로딩 표시
        function showLoading() {
            document.getElementById('loading').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }
    </script>
</body>
</html>
