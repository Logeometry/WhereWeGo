<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .login-container h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .login-container p {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .login-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .google-login {
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            color: white;
        }

        .kakao-login {
            background: linear-gradient(135deg, #fee500 0%, #ff6b35 100%);
            color: #333;
        }

        .login-button img {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }

        .status {
            margin-top: 30px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .user-info {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }

        .user-info h3 {
            color: #495057;
            margin-bottom: 10px;
        }

        .user-info p {
            color: #6c757d;
            margin: 5px 0;
        }

        .action-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .action-button {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .action-button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .action-button.danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 로그인</h1>
        <p>WhereWeGo 서비스에 로그인하세요</p>
        
        <div class="login-buttons">
            <a href="/api/v1/auth/google/login" class="login-button google-login">
                <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTIyLjU2IDEyLjI1QzIyLjU2IDExLjQ3IDIyLjQ5IDEwLjcyIDIyLjM2IDEwSDEyVjE0LjI1SDE3Ljk2QzE3LjY2IDE1LjY2IDE2Ljg4IDE2Ljg4IDE1LjY4IDE3LjY2VjIwLjE0SDE5LjQ0QzIxLjA0IDE4LjY3IDIyLjU2IDE2LjY2IDIyLjU2IDEyLjI1WiIgZmlsbD0iIzQyODVGNCIvPgo8cGF0aCBkPSJNMTIgMjNDNS45MzMgMjMgMSAxOC4wNjcgMSAxMkMxIDUuOTMzIDUuOTMzIDEgMTIgMUMxNC4xMjYgMSAxNi4xNjQgMS42NTcgMTcuODI4IDQuNzE0TDE1LjY4IDYuODU3QzE0LjQ0NSA0Ljg0MSAxMi4yOTcgMy42IDEyIDMuNkM4LjQ2OSAzLjYgNS40MzcgNi4xNjcgNC45NjcgOS41SDEuOTY5VjEyLjE0QzEuOTY5IDE2LjI2IDUuNDY5IDE5LjYgMTIgMTkuNkMxNi4yNDYgMTkuNiAxOS44MzMgMTYuNDYgMTkuODMzIDEySDEyVjguNzVIMjIuNDQ5QzIyLjU2IDkuNDcgMjIuNTYgMTAuNzIgMjIuNTYgMTJDMjIuNTYgMTguMDY3IDE3LjY2NyAyMyAxMiAyM1oiIGZpbGw9IjM0QTg1MyIvPgo8L3N2Zz4K" alt="Google">
                Google로 로그인
            </a>
            
            <a href="/api/v1/auth/kakao/login" class="login-button kakao-login">
                <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTEyIDNDNi40NzcgMyAyIDYuNDc3IDIgMTJTNi40NzcgMjEgMTIgMjFTMjIgMTcuNTIzIDIyIDEyUzE3LjUyMyAzIDEyIDNaIiBmaWxsPSIjRkVFNDAwIi8+CjxwYXRoIGQ9Ik0xMiA0QzcuNTgxIDQgNCA3LjU4MSA0IDEyUzcuNTgxIDIwIDEyIDIwUzIwIDE2LjQxOSAyMCAxMlMxNi40MTkgNCAxMiA0Wk0xMiAxOEM4LjY5MSAxOCA2IDE1LjMwOSA2IDEyUzguNjkxIDYgMTIgNlMxOCA4LjY5MSAxOCAxMlMxNS4zMDkgMTggMTIgMThaIiBmaWxsPSIjRkY2QjM1Ii8+Cjwvc3ZnPgo=" alt="Kakao">
                Kakao로 로그인
            </a>
        </div>

        <div id="statusMessage"></div>
        <div id="userInfo" class="user-info hidden">
            <h3>👤 로그인된 사용자</h3>
            <p id="userDetails">사용자 정보 로딩 중...</p>
            <div class="action-buttons">
                <button onclick="checkStatus()" class="action-button primary">상태 확인</button>
                <button onclick="logout()" class="action-button danger">로그아웃</button>
                <a href="survey_system_test.html" class="action-button primary">설문조사 테스트</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';

        // 상태 메시지 표시
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('statusMessage');
            // 줄바꿈을 <br>로 변환
            const formattedMessage = message.replace(/\n/g, '<br>');
            statusDiv.innerHTML = `<div class="status ${type}">${formattedMessage}</div>`;
            setTimeout(() => {
                statusDiv.innerHTML = '';
            }, 8000); // 메시지가 길어서 시간을 늘림
        }

        // API 호출 헬퍼
        async function apiCall(url, options = {}) {
            try {
                const response = await fetch(url, {
                    method: options.method || 'GET',
                    credentials: 'include', // 쿠키 포함
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        ...options.headers
                    },
                    body: options.body ? JSON.stringify(options.body) : undefined,
                    ...options
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ detail: 'Unknown error' }));
                    throw new Error(errorData.detail || `HTTP ${response.status}`);
                }

                return await response.json();
            } catch (error) {
                console.error('API 호출 오류:', error);
                throw error;
            }
        }

        // 로그인 상태 확인
        async function checkStatus() {
            try {
                const response = await apiCall(`${API_BASE}/survey/status`);
                
                if (response.logged_in) {
                    document.getElementById('userInfo').classList.remove('hidden');
                    document.getElementById('userDetails').innerHTML = 
                        `<strong>✅ 로그인됨</strong><br>
                         📝 설문조사: ${response.has_survey_data ? '✅ 완료' : '❌ 미완료'}<br>
                         🗳️ 투표: ${response.has_votes ? '✅ 완료' : '❌ 미완료'}<br>
                         📊 상태: ${response.status}`;
                    showStatus('✅ 로그인 상태 확인 완료 - 로그인되어 있습니다', 'success');
                } else {
                    document.getElementById('userInfo').classList.add('hidden');
                    showStatus('❌ 로그인되지 않음 - Google 또는 Kakao로 로그인해주세요', 'error');
                }
            } catch (error) {
                document.getElementById('userInfo').classList.add('hidden');
                if (error.message.includes('401') || error.message.includes('Not authenticated')) {
                    showStatus('❌ 로그인되지 않음 - Google 또는 Kakao로 로그인해주세요', 'error');
                } else {
                    showStatus(`❌ 로그인 상태 확인 실패: ${error.message}`, 'error');
                }
            }
        }

        // 로그아웃
        async function logout() {
            try {
                await apiCall(`${API_BASE}/auth/logout`, { method: 'POST' });
                document.getElementById('userInfo').classList.add('hidden');
                showStatus('로그아웃 완료', 'success');
            } catch (error) {
                showStatus(`로그아웃 실패: ${error.message}`, 'error');
            }
        }

        // 페이지 로드 시 로그인 상태 확인
        window.onload = function() {
            checkStatus();
        };
    </script>
</body>
</html>
