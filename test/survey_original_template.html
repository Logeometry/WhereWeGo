<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관광 선호도 조사 - WhereWeGo Backend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 300;
        }

        .step-title {
            color: #667eea;
            font-size: 1.5rem;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* 로그인 스타일 */
        .login-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .login-input {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .login-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .button-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        .activity-grid {
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        .time-grid {
            grid-template-columns: repeat(3, 1fr);
        }

        .season-grid {
            grid-template-columns: repeat(4, 1fr);
        }

        .preference-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .selection-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 20px 15px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .selection-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            background: linear-gradient(45deg, #5a6fd8, #6a4190);
        }

        .selection-btn:active {
            transform: translateY(-1px);
        }

        .selections-display {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            text-align: left;
        }

        .selections-display h3 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.3rem;
        }

        .selection-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .selection-item:last-child {
            border-bottom: none;
        }

        .selection-label {
            font-weight: 600;
            color: #495057;
        }

        .selection-value {
            color: #667eea;
            font-weight: 500;
        }

        .reset-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .complete-message {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .hidden {
            display: none;
        }

        .recommendation-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin: 15px 0;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .recommendation-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .recommendation-card:active {
            transform: translateY(0px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .recommendation-card.selecting {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(0.98);
        }

        .ml-recommendation-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .ml-recommendation-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .ml-recommendation-btn:active {
            transform: translateY(0);
        }

        #ml-recommendation-result {
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 2px solid #e9ecef;
        }

        .ml-recommendation-item {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .ml-recommendation-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .ml-score {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-left: 10px;
        }

        .ml-summary {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }

        .recommendation-card.selecting .info-label,
        .recommendation-card.selecting .info-value,
        .recommendation-card.selecting .place-name {
            color: white;
        }

        .recommendation-card.selecting .recommendation-header {
            color: white;
        }

        .recommendation-card.selecting .recommendation-reason {
            background: rgba(255, 255, 255, 0.2);
        }

        .recommendation-header {
            color: #667eea;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
        }

        .place-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .place-info {
            display: grid;
            gap: 8px;
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
        }

        .info-label {
            font-weight: 600;
            color: #495057;
        }

        .info-value {
            color: #667eea;
            font-weight: 500;
        }

        .recommendation-reason {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 15px;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .activity-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .time-grid, .season-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .preference-grid {
                grid-template-columns: 1fr;
            }

            .selection-btn {
                padding: 15px 10px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>관광 선호도 조사</h1>

        <!-- 로그인 단계 -->
        <div id="login-step" class="step">
            <div class="step-title">사용자 로그인</div>
            <div class="login-section">
                <input type="text" id="user-id" class="login-input" placeholder="사용자 ID를 입력하세요 (예: user123)" value="test_user">
                <br>
                <button class="login-btn" onclick="loginUser()">로그인</button>
            </div>
        </div>

        <!-- 활동 선택 단계 -->
        <div id="activity-step" class="step hidden">
            <div class="step-title">관심 있는 활동을 선택해주세요</div>
            <div class="button-grid activity-grid">
                <button class="selection-btn" onclick="selectOption('activity', '자연풍경')">자연풍경</button>
                <button class="selection-btn" onclick="selectOption('activity', '자연산림')">자연산림</button>
                <button class="selection-btn" onclick="selectOption('activity', '관람및체험')">관람및체험</button>
                <button class="selection-btn" onclick="selectOption('activity', '휴양')">휴양</button>
                <button class="selection-btn" onclick="selectOption('activity', '테마거리')">테마거리</button>
                <button class="selection-btn" onclick="selectOption('activity', '예술감상')">예술감상</button>
                <button class="selection-btn" onclick="selectOption('activity', '공연관람')">공연관람</button>
                <button class="selection-btn" onclick="selectOption('activity', '트레킹')">트레킹</button>
            </div>
        </div>

        <!-- 활동성 선택 단계 -->
        <div id="activity_level-step" class="step hidden">
            <div class="step-title">선호하는 활동성을 선택해주세요</div>
            <div class="button-grid time-grid">
                <button class="selection-btn" onclick="selectOption('activity_level', '높음')">높음</button>
                <button class="selection-btn" onclick="selectOption('activity_level', '중간')">중간</button>
                <button class="selection-btn" onclick="selectOption('activity_level', '낮음')">낮음</button>
            </div>
        </div>

        <!-- 시간대 선택 단계 -->
        <div id="time-step" class="step hidden">
            <div class="step-title">선호하는 시간대를 선택해주세요</div>
            <div class="button-grid time-grid">
                <button class="selection-btn" onclick="selectOption('time', '오전')">오전</button>
                <button class="selection-btn" onclick="selectOption('time', '오후')">오후</button>
                <button class="selection-btn" onclick="selectOption('time', '저녁')">저녁</button>
            </div>
        </div>

        <!-- 계절 선택 단계 -->
        <div id="season-step" class="step hidden">
            <div class="step-title">선호하는 계절을 선택해주세요</div>
            <div class="button-grid season-grid">
                <button class="selection-btn" onclick="selectOption('season', '봄')">봄</button>
                <button class="selection-btn" onclick="selectOption('season', '여름')">여름</button>
                <button class="selection-btn" onclick="selectOption('season', '가을')">가을</button>
                <button class="selection-btn" onclick="selectOption('season', '겨울')">겨울</button>
            </div>
        </div>

        <!-- 선호도 선택 단계 -->
        <div id="preference-step" class="step hidden">
            <div class="step-title">중요하게 생각하는 요소를 선택해주세요</div>
            <div class="button-grid preference-grid">
                <button class="selection-btn" onclick="selectOption('preference', '활동성')">활동성</button>
                <button class="selection-btn" onclick="selectOption('preference', '시간대')">시간대</button>
            </div>
        </div>

        <!-- 완료 메시지 -->
        <div id="complete-step" class="step hidden">
            <div class="complete-message">
                선택이 완료되었습니다! 두가지 관광지 중 하나를 선택해주세요.
            </div>
            <button class="selection-btn" onclick="getRecommendations()" style="margin-top: 20px;">
                심화 설문조사 하기
            </button>
        </div>

        <!-- 추천 결과 단계 -->
        <div id="recommendation-step" class="step hidden">
            <div class="step-title" id="round-title">라운드 1/5 - 관광지를 선택해주세요</div>

            <div id="progress-bar" style="background: #e9ecef; border-radius: 10px; height: 8px; margin: 20px 0;">
                <div id="progress-fill" style="background: linear-gradient(45deg, #667eea, #764ba2); height: 100%; border-radius: 10px; width: 20%; transition: width 0.3s ease;"></div>
            </div>

            <div id="recommendations-container">
                <!-- 추천 결과가 여기에 표시됩니다 -->
            </div>

            <div id="vote-section" class="hidden" style="margin-top: 20px;">
                <div style="text-align: center; color: #667eea; font-size: 1.1rem; font-weight: 500; margin-bottom: 10px;">
                    💡 원하시는 관광지를 클릭해주세요
                </div>
                <div style="text-align: center; color: #6c757d; font-size: 0.9rem;">
                    카드를 클릭하면 자동으로 다음 라운드로 진행됩니다
                </div>
            </div>

            <div id="final-result" class="hidden">
                <div class="complete-message">
                    🎉 모든 라운드가 완료되었습니다!
                </div>
                <div id="selected-places" style="margin: 20px 0;">
                    <!-- 선택된 관광지들이 여기에 표시됩니다 -->
                </div>
                
                <div style="margin: 30px 0;">
                    <button class="ml-recommendation-btn" onclick="getMlRecommendations()">
                        🤖 AI 개인화 추천 받기
                    </button>
                    <button class="reset-btn" onclick="resetSelections()">
                        다시 시작하기
                    </button>
                </div>
            </div>

            <!-- ML 추천 결과 섹션 -->
            <div id="ml-recommendation-result" class="hidden">
                <div class="step-title">🤖 AI 개인화 추천 결과</div>
                <div id="ml-loading" class="loading-spinner"></div>
                <div id="ml-recommendations-list" class="hidden">
                    <!-- ML 추천 결과가 여기에 표시됩니다 -->
                </div>
                <button class="reset-btn" onclick="hideMlRecommendations()" style="margin-top: 20px;">
                    결과 닫기
                </button>
            </div>
        </div>

        <!-- 선택 결과 표시 -->
        <div id="selections-display" class="selections-display hidden">
            <h3>선택하신 내용</h3>
            <div class="selection-item">
                <span class="selection-label">활동:</span>
                <span class="selection-value" id="selected-activity">-</span>
            </div>
            <div class="selection-item">
                <span class="selection-label">활동성:</span>
                <span class="selection-value" id="selected-activity_level">-</span>
            </div>
            <div class="selection-item">
                <span class="selection-label">시간대:</span>
                <span class="selection-value" id="selected-time">-</span>
            </div>
            <div class="selection-item">
                <span class="selection-label">계절:</span>
                <span class="selection-value" id="selected-season">-</span>
            </div>
            <div class="selection-item">
                <span class="selection-label">선호도:</span>
                <span class="selection-value" id="selected-preference">-</span>
            </div>
            <button class="reset-btn" onclick="resetSelections()">다시 선택하기</button>
        </div>

        <!-- 메시지 표시 영역 -->
        <div id="message-area"></div>
    </div>

    <script>
        // WhereWeGo-backend API 엔드포인트
        const API_BASE = 'http://127.0.0.1:8000/api/v1';
        
        let selections = {
            activity: null,
            activity_level: null,
            time: null,
            season: null,
            preference: null
        };

        let currentStep = 'login';
        let currentUser = null;

        // 로그인 함수
        async function loginUser() {
            const userId = document.getElementById('user-id').value.trim();
            if (!userId) {
                showMessage('사용자 ID를 입력해주세요.', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/survey/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userId
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    currentUser = userId;
                    showMessage(`로그인 성공: ${data.message}`, 'success');
                    
                    // 로그인 단계 숨기고 활동 선택 단계 표시
                    document.getElementById('login-step').classList.add('hidden');
                    document.getElementById('activity-step').classList.remove('hidden');
                    currentStep = 'activity';
                } else {
                    showMessage(`로그인 실패: ${data.detail || data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`네트워크 오류: ${error.message}`, 'error');
            }
        }

        async function selectOption(step, value) {
            selections[step] = value;

            // 선택값을 화면에 업데이트
            updateDisplay(step, value);

            try {
                // WhereWeGo-backend API 호출
                const response = await fetch(`${API_BASE}/survey/select`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        step: step,
                        value: value
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    showMessage(`${step}: ${value} 선택됨`, 'success');
                    
                    if (data.next_step) {
                        moveToNextStep(data.next_step);
                    }
                } else {
                    showMessage(`선택 실패: ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`네트워크 오류: ${error.message}`, 'error');
            }
        }

        function updateDisplay(step, value) {
            document.getElementById(`selected-${step}`).textContent = value;

            // 선택사항이 하나라도 있으면 결과 표시 영역을 보여줌
            if (Object.values(selections).some(v => v !== null)) {
                document.getElementById('selections-display').classList.remove('hidden');
            }
        }

        function moveToNextStep(nextStep) {
            // 현재 단계 숨기기
            document.getElementById(`${currentStep}-step`).classList.add('hidden');

            if (nextStep === 'complete') {
                // 완료 단계 표시
                document.getElementById('complete-step').classList.remove('hidden');
                currentStep = 'complete';
            } else {
                // 다음 단계 표시
                document.getElementById(`${nextStep}-step`).classList.remove('hidden');
                currentStep = nextStep;
            }
        }

        async function getRecommendations() {
            // 완료 단계 숨기고 로딩 표시
            document.getElementById('complete-step').classList.add('hidden');
            document.getElementById('recommendation-step').classList.remove('hidden');

            // 로딩 스피너 표시
            document.getElementById('recommendations-container').innerHTML = `
                <div class="loading-spinner"></div>
                <p style="text-align: center; margin-top: 20px;">맞춤형 관광지를 찾고 있습니다...</p>
            `;

            try {
                // WhereWeGo-backend API 호출
                const response = await fetch(`${API_BASE}/survey/recommendations`);
                const data = await response.json();

                if (data.status === 'success') {
                    displayRecommendations(data.recommendations);
                } else {
                    document.getElementById('recommendations-container').innerHTML = `
                        <div class="error-message">
                            <h3>추천 실패</h3>
                            <p>${data.message}</p>
                            <button class="reset-btn" onclick="resetSelections()" style="margin-top: 15px;">
                                다시 시작하기
                            </button>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('추천 요청 실패:', error);
                document.getElementById('recommendations-container').innerHTML = `
                    <div class="error-message">
                        <h3>오류 발생</h3>
                        <p>추천 서비스에 문제가 발생했습니다.</p>
                        <button class="reset-btn" onclick="resetSelections()" style="margin-top: 15px;">
                            다시 시작하기
                        </button>
                    </div>
                `;
            }
        }

        // 5라운드 시스템을 위한 전역 변수
        let currentRound = 1;
        let allRounds = [];
        let userChoices = [];

        function displayRecommendations(recommendations) {
            allRounds = recommendations.rounds;
            currentRound = 1;
            userChoices = [];

            showCurrentRound();
        }

        function showCurrentRound() {
            if (currentRound > 5) {
                showFinalResults();
                return;
            }

            const container = document.getElementById('recommendations-container');
            const roundData = allRounds[currentRound - 1];
            const primaryItem = roundData.primary.item;
            const alternativeItem = roundData.alternative.item;

            // 제목과 진행바 업데이트
            document.getElementById('round-title').textContent = `라운드 ${currentRound}/5 - 관광지를 선택해주세요`;
            document.getElementById('progress-fill').style.width = `${(currentRound / 5) * 100}%`;

            let html = `
                <!-- 첫 번째 추천 -->
                <div class="recommendation-card" onclick="selectCard('primary')" id="primary-card">
                    <div class="recommendation-header">🎯 맞춤 추천</div>
                    <div class="place-name">${primaryItem.name}</div>
                    <div class="place-info">
                        <div class="info-item">
                            <span class="info-label">카테고리:</span>
                            <span class="info-value">${primaryItem.category}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">지역:</span>
                            <span class="info-value">${primaryItem.region || '정보 없음'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">만족도 점수:</span>
                            <span class="info-value">${primaryItem.final_score ? primaryItem.final_score.toFixed(2) : '0.00'}점</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">방문자 수:</span>
                            <span class="info-value">${primaryItem.visitors_count ? primaryItem.visitors_count.toLocaleString() : '정보 없음'}명</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">주소:</span>
                            <span class="info-value">${primaryItem.address || '정보 없음'}</span>
                        </div>
                    </div>
                    <div class="recommendation-reason">
                        ${roundData.primary.reason}
                    </div>
                </div>

                <!-- 두 번째 추천 -->
                <div class="recommendation-card" onclick="selectCard('alternative')" id="alternative-card">
                    <div class="recommendation-header">🔄 대안 추천</div>
                    <div class="place-name">${alternativeItem.name}</div>
                    <div class="place-info">
                        <div class="info-item">
                            <span class="info-label">카테고리:</span>
                            <span class="info-value">${alternativeItem.category}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">지역:</span>
                            <span class="info-value">${alternativeItem.region || '정보 없음'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">만족도 점수:</span>
                            <span class="info-value">${alternativeItem.final_score ? alternativeItem.final_score.toFixed(2) : '0.00'}점</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">방문자 수:</span>
                            <span class="info-value">${alternativeItem.visitors_count ? alternativeItem.visitors_count.toLocaleString() : '정보 없음'}명</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">주소:</span>
                            <span class="info-value">${alternativeItem.address || '정보 없음'}</span>
                        </div>
                    </div>
                    <div class="recommendation-reason">
                        ${roundData.alternative.reason}
                    </div>
                </div>
            `;

            container.innerHTML = html;

            // 투표 섹션 표시
            document.getElementById('vote-section').classList.remove('hidden');
            document.getElementById('final-result').classList.add('hidden');
        }

        function selectCard(choice) {
            // 클릭된 카드에 selecting 클래스 추가
            const selectedCard = document.getElementById(choice + '-card');
            selectedCard.classList.add('selecting');

            // 카드 클릭 비활성화
            document.getElementById('primary-card').onclick = null;
            document.getElementById('alternative-card').onclick = null;

            // 0.5초 후 투표 처리
            setTimeout(() => {
                submitVote(choice);
            }, 500);
        }

        async function submitVote(choice) {
            const roundData = allRounds[currentRound - 1];
            const selectedItem = choice === 'primary' ? roundData.primary.item : roundData.alternative.item;

            // 사용자 선택 저장
            userChoices.push({
                round: currentRound,
                choice: choice,
                item: selectedItem
            });

            try {
                // WhereWeGo-backend API 호출
                const response = await fetch(`${API_BASE}/survey/vote`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        round_number: currentRound,
                        choice: choice,
                        item_name: selectedItem.name
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    showMessage(`라운드 ${currentRound}: ${selectedItem.name} 선택됨`, 'success');
                    
                    // 투표 섹션 숨기기
                    document.getElementById('vote-section').classList.add('hidden');

                    // 0.5초 후 다음 라운드로 이동
                    setTimeout(() => {
                        currentRound++;
                        showCurrentRound();
                    }, 500);
                } else {
                    showMessage(`투표 실패: ${data.error}`, 'error');
                }
            } catch (error) {
                console.error('투표 전송 실패:', error);
                showMessage('투표 전송에 실패했습니다.', 'error');
            }
        }

        function showFinalResults() {
            // 진행바 100% 완료
            document.getElementById('progress-fill').style.width = '100%';
            document.getElementById('round-title').textContent = '🎉 모든 라운드 완료!';

            // 추천 컨테이너 숨기고 최종 결과 표시
            document.getElementById('recommendations-container').style.display = 'none';
            document.getElementById('vote-section').classList.add('hidden');
            document.getElementById('final-result').classList.remove('hidden');

            // 선택된 관광지들 표시
            let resultsHtml = '<h3 style="text-align: center; margin-bottom: 20px; color: #667eea;">선택하신 관광지들</h3>';

            userChoices.forEach((choice, index) => {
                const item = choice.item;
                resultsHtml += `
                    <div class="recommendation-card" style="margin: 10px 0;">
                        <div class="recommendation-header">라운드 ${choice.round} 선택</div>
                        <div class="place-name">${item.name}</div>
                        <div class="place-info">
                            <div class="info-item">
                                <span class="info-label">카테고리:</span>
                                <span class="info-value">${item.category}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">지역:</span>
                                <span class="info-value">${item.region || '정보 없음'}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">만족도 점수:</span>
                                <span class="info-value">${item.final_score ? item.final_score.toFixed(2) : '0.00'}점</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('selected-places').innerHTML = resultsHtml;
        }

        async function getMlRecommendations() {
            // ML 추천 결과 섹션 표시
            document.getElementById('ml-recommendation-result').classList.remove('hidden');
            
            // 로딩 스피너 표시
            document.getElementById('ml-loading').style.display = 'block';
            document.getElementById('ml-recommendations-list').classList.add('hidden');

            try {
                // WhereWeGo-backend API 호출
                const response = await fetch(`${API_BASE}/survey/ml-recommendations?k=10`);
                const data = await response.json();

                // 로딩 스피너 숨기기
                document.getElementById('ml-loading').style.display = 'none';
                
                if (data.status === 'success') {
                    displayMlRecommendations(data);
                } else {
                    displayMlError(data.message || '추천을 가져오는데 실패했습니다.');
                }
            } catch (error) {
                console.error('ML 추천 오류:', error);
                document.getElementById('ml-loading').style.display = 'none';
                displayMlError('네트워크 오류가 발생했습니다.');
            }
        }

        function displayMlRecommendations(data) {
            const recommendations = data.ml_recommendations?.recommendations || [];
            const userInfo = data.base_user_info || {};
            const modelInfo = data.personalization_info || {};

            let html = '';

            // 사용자 정보 요약
            html += `
                <div class="ml-summary">
                    <h4 style="color: #1976d2; margin-bottom: 15px;">🎯 개인화 추천 기준</h4>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                        <div><strong>선호 활동:</strong> ${userInfo.preferred_category || '알 수 없음'}</div>
                        <div><strong>활동성:</strong> ${userInfo.activity_level || '알 수 없음'}</div>
                        <div><strong>선호 시간:</strong> ${userInfo.preferred_time || '알 수 없음'}</div>
                        <div><strong>선호 계절:</strong> ${userInfo.preferred_season || '알 수 없음'}</div>
                        <div><strong>중요 요소:</strong> ${userInfo.preference_type || '알 수 없음'}</div>
                    </div>
                    <p style="margin-top: 15px; color: #666; font-size: 0.9rem;">
                        ${modelInfo.model_type || 'AI 모델'}이 ${data.vote_summary?.total_votes || 0}번의 선택 패턴을 분석하여 
                        ${recommendations.length}개의 맞춤형 관광지를 추천해드립니다.
                    </p>
                </div>
            `;

            // 추천 목록
            html += '<div style="margin-top: 20px;">';
            recommendations.forEach((item, index) => {
                html += `
                    <div class="ml-recommendation-item">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <h4 style="color: #333; margin: 0;">${index + 1}. ${item.name || `관광지 ${item.item_id}`}</h4>
                            <span class="ml-score">AI 점수: ${((item.score || 0) * 100).toFixed(1)}%</span>
                        </div>
                        <div class="info-item" style="margin: 5px 0;">
                            <span class="info-label">카테고리:</span>
                            <span class="info-value">${item.category || '알 수 없음'} ${item.category_group ? `(${item.category_group})` : ''}</span>
                        </div>
                        <div class="info-item" style="margin: 5px 0;">
                            <span class="info-label">품질 점수:</span>
                            <span class="info-value">${item.final_score ? item.final_score.toFixed(2) : '0.00'}점</span>
                        </div>
                        <div style="margin-top: 10px; color: #666; font-size: 0.9rem;">
                            ${item.reason || '컨텍스트 기반 ML 추천'}
                        </div>
                    </div>
                `;
            });
            html += '</div>';

            document.getElementById('ml-recommendations-list').innerHTML = html;
            document.getElementById('ml-recommendations-list').classList.remove('hidden');
        }

        function displayMlError(message) {
            const html = `
                <div class="error-message">
                    <h4>❌ 추천 오류</h4>
                    <p style="margin-top: 15px;">${message}</p>
                    <p style="margin-top: 10px; font-size: 0.9rem; color: #666;">
                        모델 파일이 없거나 서버 오류가 발생했을 수 있습니다.
                    </p>
                </div>
            `;
            document.getElementById('ml-recommendations-list').innerHTML = html;
            document.getElementById('ml-recommendations-list').classList.remove('hidden');
        }

        function hideMlRecommendations() {
            document.getElementById('ml-recommendation-result').classList.add('hidden');
        }

        async function resetSelections() {
            // 선택값 초기화
            selections = {
                activity: null,
                activity_level: null,
                time: null,
                season: null,
                preference: null
            };

            // 5라운드 관련 변수 초기화
            currentRound = 1;
            allRounds = [];
            userChoices = [];
            currentUser = null;

            // 화면 초기화
            Object.keys(selections).forEach(key => {
                document.getElementById(`selected-${key}`).textContent = '-';
            });

            // 모든 단계 숨기기
            document.querySelectorAll('.step').forEach(step => {
                step.classList.add('hidden');
            });

            // 추천 관련 요소 초기화
            document.getElementById('recommendations-container').style.display = 'block';
            document.getElementById('vote-section').classList.add('hidden');
            document.getElementById('final-result').classList.add('hidden');
            document.getElementById('ml-recommendation-result').classList.add('hidden');
            document.getElementById('progress-fill').style.width = '20%';

            // 로그인 단계로 돌아가기
            document.getElementById('login-step').classList.remove('hidden');
            document.getElementById('selections-display').classList.add('hidden');
            document.getElementById('user-id').value = 'test_user';
            currentStep = 'login';

            try {
                // 서버에 초기화 요청
                await fetch(`${API_BASE}/survey/reset-all`);
                showMessage('모든 데이터가 초기화되었습니다.', 'success');
            } catch (error) {
                console.error('초기화 요청 실패:', error);
                showMessage('초기화 중 오류가 발생했습니다.', 'error');
            }
        }

        function showMessage(message, type) {
            const messageArea = document.getElementById('message-area');
            messageArea.innerHTML = `<div class="${type}-message">${message}</div>`;
            
            // 3초 후 메시지 자동 제거
            setTimeout(() => {
                messageArea.innerHTML = '';
            }, 3000);
        }
    </script>
</body>
</html>
