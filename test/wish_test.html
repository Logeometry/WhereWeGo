<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>찜 기능 API 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, button {
            padding: 8px;
            margin: 5px 0;
        }
        input {
            width: 200px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            margin-right: 10px;
            padding: 10px 15px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .place-item {
            border: 1px solid #ccc;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            background-color: white;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 2px solid #007bff;
            border-radius: 5px;
        }
        .section-title {
            color: #007bff;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .status-indicator {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-added {
            background-color: #d4edda;
            color: #155724;
        }
        .status-removed {
            background-color: #f8d7da;
            color: #721c24;
        }
        .status-deleted {
            background-color: #f8d7da;
            color: #721c24;
        }
        .wish-status {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 3px;
        }
        .wish-status.true {
            background-color: #d4edda;
            color: #155724;
        }
        .wish-status.false {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>찜 기능 API 테스트</h1>
    
    <div class="section">
        <div class="section-title">기본 정보 입력</div>
        <div class="form-group">
            <label for="userId">사용자 ID:</label>
            <input type="text" id="userId" placeholder="예: user123" value="user123">
        </div>
        
        <div class="form-group">
            <label for="placeId">장소 ID:</label>
            <input type="text" id="placeId" placeholder="예: place456" value="place456">
        </div>
    </div>
    
    <div class="section">
        <div class="section-title">찜 관리 기능</div>
        <div>
            <button onclick="toggleWish()">찜 토글 (추가/제거)</button>
            <button onclick="deleteWish()">찜 삭제</button>
            <button onclick="checkWishStatus()">찜 상태 확인</button>
        </div>
    </div>
    
    <div class="section">
        <div class="section-title">찜 목록 조회</div>
        <div>
            <button onclick="getWishlist()">찜 목록 조회</button>
            <button onclick="getDetailedWishlist()">찜 목록 상세 조회</button>
        </div>
    </div>
    
    <div id="result" class="result" style="display: none;">
        <h3>결과:</h3>
        <div id="resultContent"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        
        async function toggleWish() {
            const userId = document.getElementById('userId').value;
            const placeId = document.getElementById('placeId').value;
            
            if (!userId || !placeId) {
                displayError('사용자 ID와 장소 ID를 모두 입력해주세요.');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/wish`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        place_id: placeId
                    })
                });
                const data = await response.json();
                
                let statusClass = data.status === 'added' ? 'status-added' : 'status-removed';
                displayResult(`찜 토글 결과: <span class="status-indicator ${statusClass}">${data.status}</span>`);
            } catch (error) {
                displayError('찜 토글 중 오류 발생: ' + error.message);
            }
        }
        
        async function deleteWish() {
            const userId = document.getElementById('userId').value;
            const placeId = document.getElementById('placeId').value;
            
            if (!userId || !placeId) {
                displayError('사용자 ID와 장소 ID를 모두 입력해주세요.');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/wish`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        place_id: placeId
                    })
                });
                const data = await response.json();
                
                displayResult(`찜 삭제 결과: <span class="status-indicator status-deleted">${data.status}</span>`);
            } catch (error) {
                displayError('찜 삭제 중 오류 발생: ' + error.message);
            }
        }
        
        async function checkWishStatus() {
            const userId = document.getElementById('userId').value;
            const placeId = document.getElementById('placeId').value;
            
            if (!userId || !placeId) {
                displayError('사용자 ID와 장소 ID를 모두 입력해주세요.');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/wish/status?user_id=${userId}&place_id=${placeId}`);
                const data = await response.json();
                
                let statusClass = data.wished ? 'true' : 'false';
                let statusText = data.wished ? '찜함' : '찜하지 않음';
                displayResult(`찜 상태: <span class="wish-status ${statusClass}">${statusText}</span>`);
            } catch (error) {
                displayError('찜 상태 확인 중 오류 발생: ' + error.message);
            }
        }
        
        async function getWishlist() {
            const userId = document.getElementById('userId').value;
            
            if (!userId) {
                displayError('사용자 ID를 입력해주세요.');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/wishlist/${userId}`);
                const data = await response.json();
                
                if (data.success) {
                    let html = `<h4>찜 목록 (${data.count}개)</h4>`;
                    
                    if (data.count === 0) {
                        html += '<p>찜한 장소가 없습니다.</p>';
                    } else {
                        html += '<ul>';
                        data.wishlist.forEach((placeId, index) => {
                            html += `<li>${index + 1}. ${placeId}</li>`;
                        });
                        html += '</ul>';
                    }
                    
                    displayResult(html);
                } else {
                    displayError('찜 목록 조회 실패');
                }
            } catch (error) {
                displayError('찜 목록 조회 중 오류 발생: ' + error.message);
            }
        }
        
        async function getDetailedWishlist() {
            const userId = document.getElementById('userId').value;
            
            if (!userId) {
                displayError('사용자 ID를 입력해주세요.');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/wishlist/detailed/${userId}`);
                const data = await response.json();
                
                if (data.success) {
                    let html = `<h4>찜 목록 상세 정보 (${data.count}개)</h4>`;
                    
                    if (data.count === 0) {
                        html += '<p>찜한 장소가 없습니다.</p>';
                    } else {
                        data.wishlist.forEach((place, index) => {
                            html += `
                                <div class="place-item">
                                    <h5>${index + 1}. ${place.name}</h5>
                                    <p><strong>장소 ID:</strong> ${place.place_id}</p>
                                    <p><strong>주소:</strong> ${place.address}</p>
                                    <p><strong>카테고리:</strong> ${place.category}</p>
                                    <p><strong>평점:</strong> ${place.rating}</p>
                                    <p><strong>설명:</strong> ${place.description}</p>
                                </div>
                            `;
                        });
                    }
                    
                    displayResult(html);
                } else {
                    displayError('찜 목록 상세 조회 실패');
                }
            } catch (error) {
                displayError('찜 목록 상세 조회 중 오류 발생: ' + error.message);
            }
        }
        
        function displayResult(content) {
            const resultDiv = document.getElementById('result');
            const contentDiv = document.getElementById('resultContent');
            
            contentDiv.innerHTML = content;
            resultDiv.style.display = 'block';
        }
        
        function displayError(message) {
            const resultDiv = document.getElementById('result');
            const contentDiv = document.getElementById('resultContent');
            
            contentDiv.innerHTML = `<div class="error">${message}</div>`;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
