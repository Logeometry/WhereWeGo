<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhereWeGo 테스트 로그인</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: white;
        }
        .login-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .login-container h1 {
            color: #4a5568;
            margin-bottom: 20px;
        }
        .login-container p {
            color: #718096;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 600;
        }
        .status.success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }
        .status.error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #feb2b2;
        }
        .status.info {
            background: #bee3f8;
            color: #2a4365;
            border: 1px solid #90cdf4;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🗺️ WhereWeGo 테스트</h1>
        <p>통합 테스트를 위해 Google 로그인을 진행해주세요.</p>
        
        <div id="loginStatus" class="status info">로그인이 필요합니다.</div>
        
        <button class="btn" onclick="loginWithGoogle()">Google로 로그인</button>
        <br>
        <a href="comprehensive_test.html" class="btn" style="background: #48bb78;">테스트 페이지로 이동</a>
        <br>
        <button class="btn" onclick="skipLogin()" style="background: #ed8936;">로그인 건너뛰고 테스트</button>
        
        <div id="userInfo" style="margin-top: 20px; display: none;">
            <h3>로그인 정보</h3>
            <div id="userDetails"></div>
            <button class="btn" onclick="startTest()" style="background: #38b2ac;">통합 테스트 시작</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        let accessToken = null;
        let currentUser = null;

        // 페이지 로드 시 토큰 확인
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthStatus();
        });

        // 인증 상태 확인
        async function checkAuthStatus() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token') || getCookie('access_token');
            
            if (token) {
                accessToken = token;
                try {
                    const response = await fetch(`${API_BASE}/auth/me`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const userData = await response.json();
                        currentUser = userData;
                        showUserInfo(userData);
                    }
                } catch (error) {
                    console.error('인증 확인 실패:', error);
                }
            }
        }

        // 사용자 정보 표시
        function showUserInfo(userData) {
            document.getElementById('loginStatus').innerHTML = 
                `<div class="status success">로그인됨: ${userData.name || userData.email}</div>`;
            document.getElementById('userDetails').innerHTML = `
                <p><strong>이름:</strong> ${userData.name || 'N/A'}</p>
                <p><strong>이메일:</strong> ${userData.email || 'N/A'}</p>
                <p><strong>사용자 ID:</strong> ${userData.user_id || 'N/A'}</p>
            `;
            document.getElementById('userInfo').style.display = 'block';
        }

        // Google 로그인
        function loginWithGoogle() {
            // redirect=test 파라미터로 로그인
            const loginUrl = `${API_BASE}/auth/google/login?redirect=test`;
            console.log('🔍 테스트 로그인 URL:', loginUrl);
            window.location.href = loginUrl;
        }

        // 로그인 건너뛰기
        function skipLogin() {
            console.log('🔍 로그인 건너뛰고 테스트 페이지로 이동');
            window.location.href = 'comprehensive_test.html';
        }

        // 통합 테스트 시작
        function startTest() {
            if (accessToken) {
                // 토큰을 URL 파라미터로 전달
                window.location.href = `comprehensive_test.html?token=${accessToken}`;
            } else {
                alert('로그인이 필요합니다.');
            }
        }

        // 쿠키 가져오기
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }
    </script>
</body>
</html>
