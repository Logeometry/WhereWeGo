<<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Google 로그인 & 장소 클릭 테스트</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }
    #container {
      max-width: 600px;
      margin: auto;
      text-align: center;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #status {
      margin-top: 20px;
      font-weight: bold;
    }
    /* 추가: 상세 정보 박스 스타일 */
    #place-details {
      margin-top: 20px;
      text-align: left;
      border-top: 1px solid #ddd;
      padding-top: 10px;
      color: #333;
    }
    .detail-item {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #ccc;
    }
    .detail-item:last-child {
      border-bottom: none;
    }
    .detail-item h3 {
      margin: 0 0 5px 0;
      font-size: 18px;
      color: #444;
    }
    .detail-item p {
      margin: 2px 0;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>Google 로그인 & 장소 클릭 테스트</h1>

    <!-- 1) 로그인 / 로그아웃 버튼 -->
    <div id="auth-section">
      <button id="google-login-btn">Google로 로그인</button>
      <button id="kakao-login-btn">카카오로 로그인</button>
      <button id="logout-btn" style="display: none;">로그아웃</button>
      <div id="user-info" style="margin-top: 10px; color: #555;"></div>
    </div>

    <hr />

    <!-- 2) 장소 버튼 (예시로 가덕도의 3개 장소) -->
    <div id="places-section" style="display: none; margin-top: 20px;">
      <h2>장소 클릭 (로그 남기기)</h2>
      <button class="place-btn" data-place="가덕도">가덕도</button>
      <button class="place-btn" data-place="가덕도 등대">가덕도 등대</button>
      <button class="place-btn" data-place="가덕도 연대봉">가덕도 연대봉</button>
    </div>

    <div id="status"></div>
    <!-- 3) 클릭된 장소의 상세 정보를 보여줄 영역 -->
    <div id="place-details"></div>
  </div>

  <script>
    // =========================
    // 설정: API 엔드포인트 주소
    // =========================
    // 백엔드가 http://localhost:8000 에서 동작 중이라면 이대로 두세요.
    const API_BASE = "http://127.0.0.1:8000/api/v1";

    // =========================
    // DOM 요소 가져오기
    // =========================
    const googleLoginBtn = document.getElementById("google-login-btn");
    const kakaoLoginBtn  = document.getElementById("kakao-login-btn");
    const logoutBtn      = document.getElementById("logout-btn");
    const userInfoEl     = document.getElementById("user-info");
    const placesSec      = document.getElementById("places-section");
    const statusEl       = document.getElementById("status");
    const placeDetailsEl = document.getElementById("place-details");

    let currentUserId = null;  // 로그인된 user_id

    // =========================
    // 1) 로그인 상태 확인 함수
    // =========================
    async function checkLoginStatus() {
      try {
        console.log("=== 로그인 상태 확인 시작 ===");
        console.log("요청 URL:", `${API_BASE}/me`);
        
        const resp = await fetch(`${API_BASE}/me`, {
          method: "GET",
          credentials: "include",   // 쿠키 전송을 위해 반드시 include
        });
        
        console.log("응답 상태:", resp.status);
        console.log("응답 헤더:", Object.fromEntries(resp.headers.entries()));
        
        if (!resp.ok) {
          const errorText = await resp.text();
          console.log("오류 응답:", errorText);
          throw new Error(`로그인되지 않음 (${resp.status})`);
        }
        
        const data = await resp.json();
        console.log("사용자 데이터:", data);
        
        // 예시 응답: { user_id: "...", oauth: "google", email: "...", name: "...", picture: "..." }
        currentUserId = data.user_id;
        userInfoEl.textContent = `로그인 사용자: ${data.name} (${data.email})`;
        googleLoginBtn.style.display = "none";
        kakaoLoginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        placesSec.style.display = "block";   // 장소 버튼 보이기
        
        console.log("로그인 성공!");
      } catch (err) {
        console.log("로그인 확인 실패:", err.message);
        // 로그인되지 않은 상태
        currentUserId = null;
        userInfoEl.textContent = "로그인되지 않음";
        googleLoginBtn.style.display = "inline-block";
        kakaoLoginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        placesSec.style.display = "none";    // 장소 버튼 숨기기
      }
    }

    // =========================
    // 2) Google 로그인 버튼 이벤트
    // =========================
    googleLoginBtn.addEventListener("click", () => {
      // 이 URL은 FastAPI의 google_login_router가 정의한 엔드포인트입니다.
      // 리디렉션을 따라가면서 Google 로그인 화면으로 넘어갑니다.
      window.location.href = `${API_BASE}/auth/google/login`;
    });

    // =========================
    // 2-1) 카카오 로그인 버튼 이벤트
    // =========================
    kakaoLoginBtn.addEventListener("click", () => {
      // 이 URL은 FastAPI의 kakao_login_router가 정의한 엔드포인트입니다.
      // 리디렉션을 따라가면서 카카오 로그인 화면으로 넘어갑니다.
      window.location.href = `${API_BASE}/auth/kakao/login`;
    });

    // =========================
    // 3) 로그아웃 버튼 이벤트
    // =========================
    logoutBtn.addEventListener("click", async () => {
      try {
        await fetch(`${API_BASE}/auth/logout`, {
          method: "POST",
          credentials: "include",
        });
        // 로그아웃이 성공하면 상태 갱신
        checkLoginStatus();
        statusEl.textContent = "로그아웃되었습니다.";
        // 상세 정보 초기화
        placeDetailsEl.innerHTML = "";
      } catch (err) {
        console.error(err);
        statusEl.textContent = "로그아웃 중 오류 발생";
      }
    });

    // =========================
    // 4) 장소 클릭 시 로그 보내기 & 상세 정보 표시
    // =========================
    document.querySelectorAll(".place-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!currentUserId) {
          statusEl.textContent = "먼저 로그인 해주세요.";
          placeDetailsEl.innerHTML = "";
          return;
        }
        const placeName = btn.getAttribute("data-place");
        statusEl.textContent = `${placeName} 클릭 중...`;
        placeDetailsEl.innerHTML = "";  // 클릭할 때마다 이전 정보 초기화

        // save_click_log를 호출하기 위해 /detail0 을 이용합니다.
        // FastAPI: /detail0?query=<place>&user_id=<user_id>
        const url = new URL(`${API_BASE}/detail0`, window.location.origin);
        url.searchParams.append("query", placeName);
        url.searchParams.append("user_id", currentUserId);

        try {
          const resp = await fetch(url.toString(), {
            method: "GET",
            credentials: "include",  // 혹시 필요하다면
          });
          if (!resp.ok) {
            throw new Error(`HTTP ${resp.status}`);
          }
          const data = await resp.json();
          // data에는 검색 결과(장소에 대한 상세 정보 배열)가 담겨 온다고 가정

          console.log("detail0 응답:", data);
          statusEl.textContent = `${placeName} 클릭 로그 저장 완료! (응답: ${data.length}개 항목)`;

          // 4-1) 상세 정보 렌더링 함수 호출
          renderPlaceDetails(data);
        } catch (err) {
          console.error(err);
          statusEl.textContent = `로그 저장 중 오류 발생: ${err.message}`;
        }
      });
    });

    // =========================
    // 5) 상세 정보 렌더링 함수
    //    - data: 배열([...]) 또는 객체 형태의 상세 정보
    // =========================
    function renderPlaceDetails(data) {
      // 1) data가 배열 형태일 때
      if (Array.isArray(data) && data.length > 0) {
        data.forEach((item) => {
          // item 객체 안에 예: { name, description, address, img_url, rating, ... }
          // 실제 백엔드에서 내려주는 필드에 맞춰서 수정한다.
          const div = document.createElement("div");
          div.classList.add("detail-item");

          // 예시: 장소 이름
          if (item.name) {
            const h3 = document.createElement("h3");
            h3.textContent = item.name;
            div.appendChild(h3);
          }

          // 예시: 설명(description)
          if (item.description) {
            const pDesc = document.createElement("p");
            pDesc.textContent = `설명: ${item.description}`;
            div.appendChild(pDesc);
          }

          // 예시: 주소(address)
          if (item.address) {
            const pAddr = document.createElement("p");
            pAddr.textContent = `주소: ${item.address}`;
            div.appendChild(pAddr);
          }

          // 예시: 평점(rating)
          if (item.rating) {
            const pRating = document.createElement("p");
            pRating.textContent = `평점: ${item.rating}`;
            div.appendChild(pRating);
          }

          // 예시: 이미지 URL(img_url)이 있을 경우
          if (item.img_url) {
            const img = document.createElement("img");
            img.src = item.img_url;
            img.alt = item.name || "place image";
            img.style.maxWidth = "100%";
            img.style.marginTop = "8px";
            div.appendChild(img);
          }

          placeDetailsEl.appendChild(div);
        });
        return;
      }

      // 2) data가 단일 객체 형태일 때 (배열이 아닐 경우)
      if (typeof data === "object" && data !== null) {
        const item = data;
        const div = document.createElement("div");
        div.classList.add("detail-item");

        if (item.name) {
          const h3 = document.createElement("h3");
          h3.textContent = item.name;
          div.appendChild(h3);
        }
        if (item.description) {
          const pDesc = document.createElement("p");
          pDesc.textContent = `설명: ${item.description}`;
          div.appendChild(pDesc);
        }
        if (item.address) {
          const pAddr = document.createElement("p");
          pAddr.textContent = `주소: ${item.address}`;
          div.appendChild(pAddr);
        }
        if (item.rating) {
          const pRating = document.createElement("p");
          pRating.textContent = `평점: ${item.rating}`;
          div.appendChild(pRating);
        }
        if (item.img_url) {
          const img = document.createElement("img");
          img.src = item.img_url;
          img.alt = item.name || "place image";
          img.style.maxWidth = "100%";
          img.style.marginTop = "8px";
          div.appendChild(img);
        }

        placeDetailsEl.appendChild(div);
        return;
      }

      // 3) data가 비어 있거나 처리할 수 없는 형태일 때
      const msg = document.createElement("p");
      msg.textContent = "해당 장소에 대한 상세 정보가 없습니다.";
      placeDetailsEl.appendChild(msg);
    }

    // =========================
    // 페이지 로드 시 실행
    // =========================
    window.addEventListener("DOMContentLoaded", () => {
      checkLoginStatus();
    });
  </script>
</body>
</html>
